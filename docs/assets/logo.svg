<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Golden Eye Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Circuit Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Telemetry Ring / Circuit Tracks -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="#334155" stroke-width="3" />
  
  <!-- Kernel / Tracepoint Nodes -->
  <circle cx="250" cy="60" r="5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="440" cy="250" r="5" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="250" cy="440" r="5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="60" cy="250" r="5" fill="#f59e0b" filter="url(#glow)" />

  <!-- Pyramid / Eye of Providence Triangle -->
  <polygon points="250,90 90,370 410,370" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />
  <polygon points="250,115 115,355 385,355" fill="#030712" fill-opacity="0.6" stroke="#475569" stroke-width="2" />

  <!-- Radiating Rays of Surveillance / Kernel Observability -->
  <line x1="250" y1="130" x2="250" y2="160" stroke="#f59e0b" stroke-width="3" opacity="0.7" />
  <line x1="210" y1="140" x2="190" y2="165" stroke="#f59e0b" stroke-width="3" opacity="0.7" />
  <line x1="290" y1="140" x2="310" y2="165" stroke="#f59e0b" stroke-width="3" opacity="0.7" />
  <line x1="175" y1="165" x2="150" y2="190" stroke="#f59e0b" stroke-width="3" opacity="0.7" />
  <line x1="325" y1="165" x2="350" y2="190" stroke="#f59e0b" stroke-width="3" opacity="0.7" />

  <!-- Egyptian Eye of Horus / All-Seeing Third Eye Outline -->
  <!-- Upper Eyelid Curve -->
  <path d="M 155,255 Q 250,195 345,255" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <!-- Lower Eyelid Curve -->
  <path d="M 155,255 Q 250,315 345,255" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

  <!-- Eyebrow (Horus Stylized Bar) -->
  <path d="M 170,225 Q 250,175 330,225" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />

  <!-- Eye of Horus Teardrop & Spiral (Circuits) -->
  <path d="M 235,305 L 235,340" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  <path d="M 270,300 Q 285,345 320,335" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />

  <!-- Eye Iris / Pupil (SOC Core & eBPF Ring Buffer) -->
  <circle cx="250" cy="255" r="38" fill="#090d16" stroke="url(#cyanGlow)" stroke-width="4" />
  <circle cx="250" cy="255" r="22" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="250" cy="255" r="10" fill="#ffffff" />
  <!-- Iris Circuit Reticle -->
  <line x1="250" y1="217" x2="250" y2="293" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="212" y1="255" x2="288" y2="255" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Base Circuit Board Traces Under Pyramid -->
  <path d="M 120,395 H 220 L 235,410 H 265 L 280,395 H 380" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.6" />
  <circle cx="120" cy="395" r="4" fill="#06b6d4" />
  <circle cx="380" cy="395" r="4" fill="#06b6d4" />
</svg>
